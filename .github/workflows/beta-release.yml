name: Beta Release

# Manually triggerable beta release from an (open) PR head.
# Multiple betas from the same PR: simply re-run - the beta number is
# auto-incremented per base version (v2.8.2-beta.1, -beta.2, ...).

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose head is used to build the beta release"
        required: true
        type: number
      base_version:
        description: "Optional base version, e.g. 2.9.0. Empty = auto: last stable tag +1 minor bump (or PR body metadata beta-base)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve PR head + base version
        id: resolve
        env:
          PR: ${{ github.event.inputs.pr_number }}
          BASE: ${{ github.event.inputs.base_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # 1) PR head: SHA + branch + owning repo
          head_sha=$(gh api repos/"$REPO"/pulls/"$PR" --jq .head.sha)
          head_ref=$(gh api repos/"$REPO"/pulls/"$PR" --jq .head.ref)
          head_branch=$(gh api repos/"$REPO"/pulls/"$PR" --jq .head.repo.full_name)
          echo "PR#$PR head: $head_ref @ $head_sha (repo $head_branch)"

          # Remote for tag queries: this step runs BEFORE checkout, so there is no
          # `origin` remote yet - use the authed URL (token never echoed: no set -x).
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # 2) Optional: PR body metadata line "beta-base: X.Y.Z" wins over the dispatch input
          body_base=$(gh api repos/"$REPO"/pulls/"$PR" --jq .body | awk -F'beta-base: *' 'NF>1{print $2}' | awk '{print $1}')
          echo "PR body metadata beta-base: ${body_base:-<none>}"

          # 3) Determine base version: PR body > dispatch input > auto (last stable tag + minor bump)
          latest_stable=$(git ls-remote --tags "$REMOTE" 'v*' | awk -F/ '{print $NF}' | grep -vE '\-(beta|alpha|rc)\.' | sed 's/^v//' | sort -V | tail -1)
          echo "Latest stable tag: v$latest_stable"
          base="${BASE:-${body_base:-}}"
          if [ -z "$base" ]; then
            # minor bump: X.Y.Z -> X.(Y+1).0 - a beta from an open PR = next feature pre-release
            IFS=. read -r MAJ MIN PAT <<<"$latest_stable"
            base="$MAJ.$((MIN+1)).0"
            echo "Auto base: v$base (minor bump over v$latest_stable)"
          fi

          # 4) Beta number: highest existing <base>-beta.N + 1 (else 1)
          existing=$(git ls-remote --tags "$REMOTE" "v${base}-beta.*" | awk -F/ '{print $NF}' | sed "s/^v${base}-beta\.//" | sort -n | tail -1)
          if [ -n "$existing" ]; then
            beta=$((existing + 1))
            echo "Highest existing beta: v${base}-beta.${existing} -> new beta: v${base}-beta.${beta}"
          else
            beta=1
            echo "No existing beta for v${base} -> new beta: v${base}-beta.${beta}"
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-beta.${beta}" >> "$GITHUB_OUTPUT"
          echo "version=${base}-beta.${beta}" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head (by SHA - no tag push first = no CI double-trigger)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          fetch-depth: 0

      - name: Set version in manifest
        run: |
          jq --arg v "${{ steps.resolve.outputs.version }}" '.version = $v' \
            custom_components/omv/manifest.json > tmp.json
          mv tmp.json custom_components/omv/manifest.json

      - name: Release notes (PR body - avoid changelog dependency)
        run: |
          # Single combined endpoint argument (gh api accepts exactly one;
          # a split repo/endpoint -> "accepts 1 arg(s), received 2").
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }}" --jq .body > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "PR body empty - using changelog [Unreleased]" >&2
            awk '/^## \[Unreleased\]/{f=1;next} f && /^## /{exit} f' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "No release notes (empty PR body, no [Unreleased])" >&2
            exit 1
          fi

      - name: Create release ZIP
        run: |
          cd custom_components/omv
          zip -r ../../omv.zip .

      - name: Create/replace Pre-Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          prerelease: true
          bodyFile: release-notes.md
          generateReleaseNotes: true
          artifacts: omv.zip
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

      - name: Publish beta tag (remote)
        run: |
          git config user.name "slydlake"
          git config user.email "sly.dlake@gmail.com"
          git tag "${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

      - name: Summary
        run: |
          echo "::notice::Beta release ${{ steps.resolve.outputs.tag }} from PR#${{ github.event.inputs.pr_number }} (head ${{ steps.resolve.outputs.head_ref }}) created"
