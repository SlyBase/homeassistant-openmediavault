---
name: "HA Smoke Test"

# Only one deploy+verify against the single production Pi/HA instance at a
# time — parallel PR runs would otherwise race on the same target.
concurrency:
  group: ha-smoke-test
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=mikefarah/yq
  YQ_VERSION: "v4.53.3"

jobs:
  ci-gate:
    name: Gate on CI success
    # The CI workflow (lint/test/hassfest) runs concurrently against the same
    # head SHA. Gate the smoke test on it: deploy to the live Pi only once
    # every non-skipped CI job is green. Runs on a cheap ubuntu-latest (not
    # the k8s runner) and reports ci_green so the smoke job can be skipped
    # (grey) rather than failed (red) when CI is not green — the CI job already
    # reports the failure.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ci_green: ${{ steps.gate.outputs.ci_green }}
    steps:
      - name: Poll CI check-runs for this head SHA
        id: gate
        run: |
          set -euo pipefail
          # hacs and release are `if: false` on PRs, so they create no check
          # runs; only lint/test/hassfest count. A CI job's `if` being false
          # yields no check run, so the filter is stable.
          for _ in $(seq 1 40); do
            resp=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")
            total=$(jq '[.check_runs[] | select(.name|IN("lint","test","hassfest"))] | length' <<<"$resp")
            if [ "${total}" -eq 0 ]; then
              sleep 30
              continue
            fi
            done_=$(jq '[.check_runs[] | select(.name|IN("lint","test","hassfest")) | select(.status=="completed")] | length' <<<"$resp")
            if [ "${done_}" -lt "${total}" ]; then
              sleep 30
              continue
            fi
            ok=$(jq '[.check_runs[] | select(.name|IN("lint","test","hassfest")) | select(.conclusion=="success")] | length' <<<"$resp")
            if [ "${ok}" -eq "${total}" ]; then
              echo "ci_green=true" >> "$GITHUB_OUTPUT"
              echo "CI green — proceeding with smoke test."
              exit 0
            fi
            echo "ci_green=false" >> "$GITHUB_OUTPUT"
            echo "CI failed — skipping smoke test."
            exit 0
          done
          echo "ci_green=false" >> "$GITHUB_OUTPUT"
          echo "Timed out waiting for CI — skipping smoke test."

  smoke:
    name: Deploy + REST verify on Pi
    needs: ci-gate
    # Dependabot pull_request runs cannot read Actions secrets (they use a
    # separate Dependabot secret store), so the Infisical fetch would fail with
    # "Missing universal auth credentials". A live Pi deploy adds no value for a
    # dependency/actions bump anyway — skip the job so it reports neutrally.
    # Also skip when CI is not green (ci-gate output), except on manual
    # workflow_dispatch where an explicit request overrides the gate.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || needs.ci-gate.outputs.ci_green == 'true')
    # Ephemeral ARC runner (org-scoped, kubernetes containerMode) — see
    # homelab kubernetes/apps/arc-runners. Fresh pod per run, nothing persists.
    runs-on: k8s
    # ARC's kubernetes containerMode enforces ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER,
    # so every job must declare its own container or the runner refuses to run
    # any step. node:*-bookworm is buildpack-deps-based (git/curl/openssh-client
    # already present) and matches the runtime actions/checkout itself needs.
    container:
      image: node:24-bookworm
    # GitHub Actions defaults run: steps to `sh` (not bash) when a job
    # container is set, and dash's `set` doesn't support `-o pipefail`,
    # which every multi-command step below relies on.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install CLI dependencies (ephemeral pod)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends openssh-client rsync jq
          wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Fetch SSH key from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ vars.INFISICAL_URL }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci/ssh

      - name: Fetch HA URL/token from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ vars.INFISICAL_URL }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci/homeassistant

      - name: Setup SSH config for the pi
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEYS_YAML" > /tmp/ssh-keys.yaml

          cat > ~/.ssh/config <<-'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

          host_ip=$(yq eval '.hosts.raspi.ip' /tmp/ssh-keys.yaml)
          host_user=$(yq eval '.hosts.raspi.user' /tmp/ssh-keys.yaml)
          host_port=$(yq eval '.hosts.raspi.port' /tmp/ssh-keys.yaml)

          cat >> ~/.ssh/config <<-EOF
          Host pi
            HostName ${host_ip}
            User ${host_user}
            Port ${host_port}
            IdentityFile ~/.ssh/pi_key
            IdentitiesOnly yes
          EOF

          yq eval '.ssh_keys.raspi' /tmp/ssh-keys.yaml > ~/.ssh/pi_key
          chmod 600 ~/.ssh/pi_key ~/.ssh/config
          ssh-keyscan -H "${host_ip}" >> ~/.ssh/known_hosts 2>/dev/null
          rm -f /tmp/ssh-keys.yaml

      - name: Deploy to Home Assistant
        run: bash .github/scripts/deploy-to-homeassistant.sh

      - name: Verify OMV entities via HA REST API (deterministic)
        run: |
          set -euo pipefail
          entities=("sensor.omv_omv8_cpu_auslastung" "sensor.omv_omv8_speicherauslastung")
          max_wait=90

          for entity in "${entities[@]}"; do
            echo "==> Polling ${entity}..."
            elapsed=0
            state=""
            while true; do
              # Bearer token goes over curl's stdin config (-K -), not argv,
              # so it never shows up in `ps` on the remote pi. Heredoc is
              # intentionally unquoted: ${entity}/${HA_TOKEN} must expand
              # locally (client-side) since only the runner has HA_TOKEN.
              # shellcheck disable=SC2029,SC2087
              state=$(ssh pi "curl -sf --max-time 5 -K - http://localhost:8123/api/states/${entity}" <<HDR | jq -r '.state // empty'
          header = "Authorization: Bearer ${HA_TOKEN}"
          HDR
              ) || state=""

              if [[ "${state}" =~ ^-?[0-9]+([.][0-9]+)?$ ]]; then
                echo "    ${entity} = ${state}"
                break
              fi

              if [[ ${elapsed} -ge ${max_wait} ]]; then
                echo "ERROR: ${entity} did not report a numeric state within ${max_wait}s (last state: '${state}')" >&2
                exit 1
              fi

              sleep 5
              elapsed=$((elapsed + 5))
            done
          done

          echo "✅ Smoke test passed: OMV entities report live numeric state."
