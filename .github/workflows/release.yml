name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve release tag
        id: release
        run: |
          TAG_INPUT="${{ inputs.tag || github.event.inputs.tag }}"
          TAG_INPUT="${TAG_INPUT#refs/tags/}"
          VERSION="${TAG_INPUT#v}"

          if [ -z "$VERSION" ]; then
            echo "Release tag input is required" >&2
            exit 1
          fi

          if echo "$VERSION" | grep -Eqi 'beta|alpha|rc'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Bump version files (pyproject + manifest)
        run: |
          version="${{ steps.release.outputs.version }}"
          # manifest.json (bumped here, so the ZIP below ships the release version)
          if jq -e --arg v "$version" '.version == $v' custom_components/omv/manifest.json > /dev/null; then
            echo "manifest.json already at ${version}"
          else
            jq --arg v "$version" '.version = $v' \
              custom_components/omv/manifest.json > tmp.json
            mv tmp.json custom_components/omv/manifest.json
          fi
          # pyproject.toml (project version)
          if grep -q "^version = \"${version}\"" pyproject.toml; then
            echo "pyproject.toml already at ${version}"
          else
            sed -i "s/^version = \".*\"/version = \"${version}\"/" pyproject.toml
          fi
          git diff --quiet pyproject.toml custom_components/omv/manifest.json && echo "no version change" || echo "version files changed"

      - name: Extract release notes from changelog
        run: |
          version="${{ steps.release.outputs.version }}"
          # Strip pre-release suffix (e.g. 2.1.3-beta.1 → 2.1.3) so the lookup
          # always matches the stable changelog section.
          changelog_version="${version%%-*}"

          awk -v version="$changelog_version" '
            $0 ~ "^## \\[" version "\\]" {
              in_section = 1
              found = 1
            }
            in_section {
              if (found && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]") {
                exit
              }
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for version $changelog_version" >&2
            exit 1
          fi

      - name: Create release ZIP
        run: |
          cd custom_components/omv
          zip -r ../../omv.zip .

      - name: Upload release asset
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          bodyFile: release-notes.md
          generateReleaseNotes: true
          artifacts: omv.zip
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

      - name: Open version-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.release.outputs.version }}"
          if git diff --quiet pyproject.toml custom_components/omv/manifest.json; then
            echo "version files already in sync — nothing to do"
            exit 0
          fi
          git config user.name "slybase-bot"
          git config user.email "slybase-bot@users.noreply.github.com"
          git add pyproject.toml custom_components/omv/manifest.json
          git commit -m "chore: bump version to ${version} (release)"
          branch="chore/bump-${version}"
          git push origin HEAD:refs/heads/${branch}
          gh pr create \
            --base main \
            --head ${branch} \
            --title "chore: bump version to ${version} (release)" \
            --body "Automatically created by the release workflow. Bumps \`pyproject.toml\` and \`manifest.json\` to \`${version}\`."
          echo "version bump PR opened for ${version}"

